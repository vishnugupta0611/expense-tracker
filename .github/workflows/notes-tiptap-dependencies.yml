name: Notes Tiptap build

on:
  push:
    branches:
      - feat/notes-tiptap-migration
    paths:
      - package.json
      - package-lock.json
      - src/**
      - vite.config.js
      - .github/workflows/notes-tiptap-dependencies.yml
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - src/**
      - vite.config.js
      - .github/workflows/notes-tiptap-dependencies.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
